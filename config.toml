baseURL = '/'
title = 'accessible.tips'

DefaultContentLanguage = "en"
languageCode = 'en-us'
timeZone = 'UTC'

enableEmoji = true
enableRobotsTXT = true
rssLimit = 25


theme = ['hugo-admonitions', 'hugo-xmin']

uglyURLs = false
[permalinks]
  tips = '/tips/:slug/'
  anecdotes = '/anecdotes/:slug/'
  faq = '/faq/:slug/'
  news = '/news/:year-:month-:day-:slug/'

[taxonomies]
  tag = 'tags'
  author = 'authors'

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = 'tags'
    weight = 100

[sitemap]
  changefreq = 'weekly'
  filename = 'sitemap.xml'
  priority = 0.5

[imaging]
  [imaging.exif]
    disableDate = false
    disableLatLong = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github"

[outputs]
    home = ["HTML", "RSS", "searchvocab"]

# Custom output format for the corrector's vocabulary asset. Emitted once
# (bound to the home page) as /search-vocab.json every build, so the corrector's
# known-term vocabulary always tracks the live indexed corpus.
[outputFormats.searchvocab]
    mediaType = "application/json"
    baseName = "search-vocab"
    isPlainText = true
    notAlternative = true

[params]
  description = 'A collection of accessibility tips and tricks'
  footer = '&copy; {Year}'

[menu]
[[menu.main]]
  identifier = 'search'
  name = 'Search'
  url = '/search/'
  weight = 10
[[menu.main]]
  identifier = 'tips'
  name = 'Tips'
  url = '/tips/'
  weight = 30
[[menu.main]]
  identifier = 'anecdotes'
  name = 'Anecdotes'
  url = '/anecdotes/'
  weight = 40
[[menu.main]]
  identifier = 'faq'
  name = 'FAQ'
  url = '/faq/'
  weight = 50
[[menu.main]]
  identifier = 'posts'
  name = 'News'
  url = '/news/'
  weight = 60
[[menu.main]]
  identifier = 'about'
  name = 'About'
  url = '/'
  weight = 70
[[menu.main]]
  identifier = 'rss'
  name = 'RSS'
  url = 'index.xml'
  weight = 80