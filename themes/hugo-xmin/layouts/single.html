{{ partial "header.html" . }}

{{ partial "page_meta.html" . }}

<main data-pagefind-body>
{{ .Content }}

{{ if .Params.changelog }}
<a class="heading" href="#changelog"><h2 id="changelog">Changelog</h2></a>
{{ partial "_back_to_top_nav.html" . }}
<div class="changelog">
<dl>
{{ range .Params.changelog }}
<dt><strong>{{ .date }}</strong></dt>
<dd>{{ .text }}</dd>
{{ end }}
</dl>
</div>
{{ end }}
</main>

{{ partial "footer.html" . }}
