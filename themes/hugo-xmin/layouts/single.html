{{ partial "header.html" . }}

<main>
{{ partial "page_meta.html" . }}

<div data-pagefind-body>
<a id="content"></a>
{{ partial "equiv-inject.html" . }}
{{ partial "search-filters.html" . }}
{{ .Content }}

{{ if .Params.changelog }}
<h2 id="changelog">Changelog</h2>
<div class="changelog">
<dl>
{{ range .Params.changelog }}
<dt><strong>{{ .date }}</strong></dt>
<dd>{{ .text }}</dd>
{{ end }}
</dl>
</div>
{{ end }}
</div>
</main>

{{ partial "footer.html" . }}
