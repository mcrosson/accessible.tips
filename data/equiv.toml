# equiv.toml — hand-curated search-equivalence classes (Decisions 8/15, algorithm M5).
# Read by _partials/equiv-inject.html: a page matching ANY member of a class
# (normalized whole-word/phrase match over title + body + tags + search_terms) gets
# the class's OTHER members injected as hidden in-body text inside
# data-pagefind-body, so a search for any variant finds the page. Singular/plural
# is handled by explicit membership only — there is no singularizer.

